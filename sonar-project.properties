sonar.projectKey=sahnsookyung_stonks-radar
sonar.projectName=Stonks Radar
sonar.projectVersion=0.1.0
sonar.organization=sahnsookyung
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true

sonar.sources=apps,packages,scripts
sonar.tests=tests,apps/web/src
sonar.test.inclusions=tests/**/*.py,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/.generated-public/**,\
  apps/web/public/public/**,\
  apps/web/src/**/*.test.ts,\
  apps/web/src/**/*.test.tsx,\
  artifacts/**,\
  playwright-report/**,\
  test-results/**,\
  scripts/build_seed_snapshots.py,\
  **/*.min.js,\
  **/package-lock.json

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,packages/shared-types/tsconfig.json
sonar.scm.provider=git
