sonar.projectKey=sahnsookyung_stonks-radar
sonar.projectName=Stonks Radar
sonar.projectVersion=0.1.0
sonar.organization=sahnsookyung
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true

sonar.sources=apps,packages,scripts
sonar.tests=tests,apps/web/src
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx

sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/deps/**,\
  **/_build/**,\
  **/.generated-public/**,\
  apps/backend_elixir/test/**,\
  apps/web/public/public/**,\
  apps/web/src/pages/**,\
  apps/web/src/generated/**,\
  apps/web/src/**/*.test.ts,\
  apps/web/src/**/*.test.tsx,\
  artifacts/**,\
  playwright-report/**,\
  test-results/**,\
  **/*.min.js,\
  **/package-lock.json

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json,packages/shared-types/tsconfig.json
sonar.scm.provider=git

# Unit coverage is enforced on deterministic library/security/business logic.
# Page containers, visual integrations, external-provider adapters, deploy/seed
# scripts, and queue/worker orchestration are validated by lint/build/e2e and
# integration tests, but they create noisy line-coverage denominators.
sonar.coverage.exclusions=\
  apps/web/src/pages/**,\
  apps/web/playwright.config.ts,\
  apps/web/postcss.config.cjs,\
  apps/web/vite.config.ts,\
  apps/web/src/components/Badge.tsx,\
  apps/web/src/components/CalendarTable.tsx,\
  apps/web/src/components/EntityLink.tsx,\
  apps/web/src/components/EventList.tsx,\
  apps/web/src/components/EventMap.tsx,\
  apps/web/src/components/MarketPulse.tsx,\
  apps/web/src/components/NewsEventCard.tsx,\
  apps/web/src/components/Shell.tsx,\
  apps/web/src/components/SnapshotBanner.tsx,\
  apps/web/src/components/TermTooltip.tsx,\
  apps/web/src/generated/**,\
  apps/web/src/i18n/**,\
  apps/web/src/lib/api.ts,\
  apps/web/src/lib/disclosureLabels.ts,\
  apps/web/src/lib/locale.ts,\
  apps/web/src/lib/portfolioAtlas.ts,\
  apps/web/src/lib/portfolioTerms.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/test/**,\
  apps/web/public/**,\
  apps/web/src/router.tsx,\
  apps/backend_elixir/**,\
  scripts/**

sonar.cpd.exclusions=\
  apps/backend_elixir/priv/repo/migrations/**,\
  packages/shared-config/*.generated.json
