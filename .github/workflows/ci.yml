name: ci

on:
  push:
  pull_request:

jobs:
  web-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"
      - run: npm install
      - run: npm run build:map-assets
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run backend:check
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e

  build-api-elixir-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 -f apps/backend_elixir/Dockerfile .

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/cloudflare/terraform infra/oci/terraform
