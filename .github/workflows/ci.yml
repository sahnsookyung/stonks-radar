name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"
      - run: npm install
      - run: npm run build:map-assets
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run backend:check
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e

  build-api-elixir-linux-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and optionally publish ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend_elixir/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main
          cache-from: type=gha,scope=api-elixir-arm64
          cache-to: type=gha,scope=api-elixir-arm64,mode=max

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/cloudflare/terraform infra/oci/terraform
