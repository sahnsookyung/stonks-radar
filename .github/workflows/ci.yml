name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_image_changed: ${{ steps.filter.outputs.api_image_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect API image changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          base_sha="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            echo "api_image_changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### API image change detection"
              echo
              echo "No usable base SHA was available, so the API image build is enabled."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags --depth=2 origin "$base_sha" "$HEAD_SHA" || true
          changed_files="$(git diff --name-only "$base_sha" "$HEAD_SHA" || git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          image_path_regex='^(apps/backend_elixir/|config/|compose\.yaml$|infra/docker-compose\.prod\.yml$|scripts/deploy.*\.sh$|\.dockerignore$|package(-lock)?\.json$|\.github/workflows/(ci|deploy|production-autodeploy)\.yml$)'

          if printf '%s\n' "$changed_files" | grep -Eq "$image_path_regex"; then
            api_image_changed=true
          else
            api_image_changed=false
          fi

          echo "api_image_changed=$api_image_changed" >> "$GITHUB_OUTPUT"
          {
            echo "### API image change detection"
            echo
            echo "- Base SHA: \`$base_sha\`"
            echo "- Head SHA: \`$HEAD_SHA\`"
            echo "- API image changed: \`$api_image_changed\`"
            echo
            echo "<details><summary>Changed files</summary>"
            echo
            printf '%s\n' "$changed_files" | sed 's/^/- /'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  web-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"
      - run: npm install
      - run: npm run build:map-assets
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run backend:check
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e

  build-api-elixir-linux-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.api_image_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and optionally publish ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend_elixir/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/cloudflare/terraform infra/oci/terraform
