name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_image_changed: ${{ steps.filter.outputs.api_image_changed }}
      app_checks_changed: ${{ steps.filter.outputs.app_checks_changed }}
      terraform_changed: ${{ steps.filter.outputs.terraform_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect API image changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          base_sha="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          fi

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            {
              echo "api_image_changed=true"
              echo "app_checks_changed=true"
              echo "terraform_changed=true"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### API image change detection"
              echo
              echo "No usable base SHA was available, so all change-gated jobs are enabled."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags --depth=2 origin "$base_sha" "$HEAD_SHA" || true
          changed_files="$(git diff --name-only "$base_sha" "$HEAD_SHA" || git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          image_path_regex='^(apps/backend_elixir/|packages/(schemas|shared-config)/|config/|compose\.yaml$|infra/docker-compose\.prod\.yml$|apps/backend_elixir/Dockerfile$|\.dockerignore$)'
          app_checks_regex='^(apps/(web|backend_elixir)/|packages/|scripts/build_map_assets\.mjs$|compose\.yaml$|infra/(Caddyfile|docker-compose\.prod\.yml)$|config/|package(-lock)?\.json$)'
          terraform_path_regex='^infra/(cloudflare|oci)/terraform/'

          if printf '%s\n' "$changed_files" | grep -Eq "$image_path_regex"; then
            api_image_changed=true
          else
            api_image_changed=false
          fi

          if printf '%s\n' "$changed_files" | grep -Eq "$app_checks_regex"; then
            app_checks_changed=true
          else
            app_checks_changed=false
          fi

          if printf '%s\n' "$changed_files" | grep -Eq "$terraform_path_regex"; then
            terraform_changed=true
          else
            terraform_changed=false
          fi

          {
            echo "api_image_changed=$api_image_changed"
            echo "app_checks_changed=$app_checks_changed"
            echo "terraform_changed=$terraform_changed"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### API image change detection"
            echo
            echo "- Base SHA: \`$base_sha\`"
            echo "- Head SHA: \`$HEAD_SHA\`"
            echo "- API image changed: \`$api_image_changed\`"
            echo "- App checks changed: \`$app_checks_changed\`"
            echo "- Terraform changed: \`$terraform_changed\`"
            echo
            echo "<details><summary>Changed files</summary>"
            echo
            printf '%s\n' "$changed_files" | sed 's/^/- /'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  web-and-schemas:
    needs: changes
    if: ${{ needs.changes.outputs.app_checks_changed == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: frw_test
          POSTGRES_USER: frw
          POSTGRES_PASSWORD: frw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frw -d frw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://frw:frw@localhost:5432/frw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"
      - run: npm install
      - run: npm run build:map-assets
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run backend:check
      - run: npm run backend:test:db
      - run: npm run backend:snapshots:validate-static
      - run: npx playwright install --with-deps chromium
      - run: npm run web:e2e
      - name: Prepare web deploy artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          rm -rf artifacts/web-deploy
          mkdir -p artifacts/web-deploy/apps/web/public
          cp -a apps/web/dist artifacts/web-deploy/apps/web/dist
          cp -a apps/web/public/public artifacts/web-deploy/apps/web/public/public
          test -s artifacts/web-deploy/apps/web/dist/index.html
          test -s artifacts/web-deploy/apps/web/public/public/latest/manifest.json
      - name: Upload web deploy artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-deploy-${{ github.sha }}
          path: artifacts/web-deploy
          if-no-files-found: error
          retention-days: 7

  build-api-elixir-linux-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.api_image_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and optionally publish ARM64 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend_elixir/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:main

  terraform-fmt:
    needs: changes
    if: ${{ needs.changes.outputs.terraform_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/cloudflare/terraform infra/oci/terraform
