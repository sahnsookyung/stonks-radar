name: infra-plan

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Terraform stack to plan"
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - oci
      runner:
        description: "Execution path"
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-fmt:
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' && '["ubuntu-latest"]') || '["self-hosted","linux","stonks-radar-deploy"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/cloudflare/terraform infra/oci/terraform

  cloudflare-plan:
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' && '["ubuntu-latest"]') || '["self-hosted","linux","stonks-radar-deploy"]') }}
    needs: terraform-fmt
    if: ${{ inputs.target == 'all' || inputs.target == 'cloudflare' }}
    defaults:
      run:
        working-directory: infra/cloudflare/terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_origin_ipv4: ${{ secrets.STONKS_ORIGIN_IPV4 }}
      TF_VAR_hostname: stonks.sookyungahn.com
      TF_VAR_manage_web_analytics: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false

  oci-plan:
    runs-on: ${{ fromJSON((inputs.runner == 'github-hosted' && '["ubuntu-latest"]') || '["self-hosted","linux","stonks-radar-deploy"]') }}
    needs: terraform-fmt
    if: ${{ inputs.target == 'all' || inputs.target == 'oci' }}
    defaults:
      run:
        working-directory: infra/oci/terraform
    env:
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_availability_domain: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
      TF_VAR_subnet_ocid: ${{ secrets.OCI_SUBNET_OCID }}
      TF_VAR_image_ocid: ${{ secrets.OCI_ARM64_IMAGE_OCID }}
      TF_VAR_ssh_authorized_keys: ${{ secrets.STONKS_SSH_AUTHORIZED_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false
