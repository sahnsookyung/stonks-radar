name: production-autodeploy

on:
  workflow_run:
    workflows:
      - ci
      - sonarqube
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: stonks-radar-production-autodeploy-main
  cancel-in-progress: false

jobs:
  dispatch-production-deploy:
    name: Dispatch production deploy after green main
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require green gates and dispatch deploy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;
            const deployWorkflow = "deploy.yml";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const required = [
              { workflow_id: "ci.yml", label: "ci" },
              { workflow_id: "sonarqube.yml", label: "sonarqube" },
            ];

            if (headBranch !== "main") {
              core.notice(`Skipping ${headSha}: branch ${headBranch} is not main.`);
              return;
            }

            const currentMain = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            });

            if (currentMain.data.object.sha !== headSha) {
              core.notice(`Skipping stale SHA ${headSha}; main is now ${currentMain.data.object.sha}.`);
              return;
            }

            for (const check of required) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: check.workflow_id,
                head_sha: headSha,
                per_page: 10,
              });

              const latest = data.workflow_runs.find((run) => run.head_sha === headSha);
              if (!latest) {
                core.notice(`Waiting for ${check.label}: no run yet for ${headSha}.`);
                return;
              }

              if (latest.status !== "completed") {
                core.notice(`Waiting for ${check.label}: ${latest.status} for ${headSha}.`);
                return;
              }

              if (latest.conclusion !== "success") {
                core.setFailed(`${check.label} completed with ${latest.conclusion}: ${latest.html_url}`);
                return;
              }

              core.info(`${check.label} is green for ${headSha}: ${latest.html_url}`);
            }

            const deployRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: deployWorkflow,
              head_sha: headSha,
              per_page: 20,
            });

            const existingDeploy = deployRuns.data.workflow_runs.find((run) => run.head_sha === headSha);
            if (existingDeploy) {
              core.notice(`Deploy already exists for ${headSha}: ${existingDeploy.html_url}`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: deployWorkflow,
              ref: "main",
              inputs: {
                runner: "github-hosted",
                mode: "fast",
                verify: "false",
              },
            });

            for (let attempt = 1; attempt <= 10; attempt += 1) {
              await sleep(3_000);
              const createdDeployRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: deployWorkflow,
                head_sha: headSha,
                per_page: 20,
              });
              const createdDeploy = createdDeployRuns.data.workflow_runs.find((run) => run.head_sha === headSha);
              if (createdDeploy) {
                core.info(`Deploy run created for ${headSha}: ${createdDeploy.html_url}`);
                break;
              }
              core.info(`Waiting for deploy run to appear for ${headSha} (attempt ${attempt}/10).`);
            }

            await core.summary
              .addHeading("Production deploy dispatched")
              .addRaw(`Dispatched ${deployWorkflow} for main at ${headSha}.`)
              .write();
