name: sonarqube

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Analysis target"
        required: true
        default: configured
        type: choice
        options:
          - local-smoke
          - configured
      organization:
        description: "Optional SonarQube Cloud organization override"
        required: false
        default: ""
      project_key:
        description: "Optional SonarQube project key override"
        required: false
        default: ""
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  configured-analysis:
    name: Configured SonarQube analysis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'configured' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ github.event.inputs.organization || vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_PROJECT_KEY: ${{ github.event.inputs.project_key || vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check SonarQube configuration
        id: sonar-config
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "target=none" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not configured; skipping external SonarQube analysis."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "${SONAR_HOST_URL:-}" ]; then
            echo "target=server" >> "$GITHUB_OUTPUT"
            echo "Using configured SonarQube Server at ${SONAR_HOST_URL}"
          else
            echo "target=cloud" >> "$GITHUB_OUTPUT"
            echo "Using SonarQube Cloud organization ${SONAR_ORGANIZATION}"
          fi

      - name: Set up Python
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.2"

      - name: Install Node dependencies
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        run: npm ci

      - name: Run backend tests with coverage
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        env:
          PYTHONPATH: apps/api/src:apps/worker/src:apps/fetch-sandbox/src
        run: |
          uv run --project apps/api --extra dev --with ./apps/fetch-sandbox --with pytest-cov \
            python -m pytest -q tests \
              --cov=apps/api/src \
              --cov=apps/worker/src \
              --cov=apps/fetch-sandbox/src \
              --cov=scripts \
              --cov-report=xml:coverage.xml

      - name: Run frontend tests with coverage
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        run: npm --workspace apps/web run test:coverage

      - name: Verify coverage reports exist
        if: ${{ steps.sonar-config.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          test -s coverage.xml
          test -s apps/web/coverage/lcov.info

      - name: SonarQube Server scan
        if: ${{ steps.sonar-config.outputs.target == 'server' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'true' }}

      - name: SonarQube Cloud scan
        id: sonar-cloud-scan
        if: ${{ steps.sonar-config.outputs.target == 'cloud' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'true' }}

      - name: Report SonarQube Cloud processing result
        if: ${{ steps.sonar-config.outputs.target == 'cloud' && always() }}
        env:
          SCAN_OUTCOME: ${{ steps.sonar-cloud-scan.outcome }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::.scannerwork/report-task.txt was not produced; scanner outcome was ${SCAN_OUTCOME}."
            exit 1
          fi

          echo "=== Sonar task metadata ==="
          sed -E 's/(serverUrl=).*/\1[redacted]/' .scannerwork/report-task.txt

          ce_task_url="$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d= -f2-)"
          if [ -z "$ce_task_url" ]; then
            echo "::error::No ceTaskUrl found in .scannerwork/report-task.txt."
            exit 1
          fi

          response="$(curl -fsS -u "${SONAR_TOKEN}:" "$ce_task_url")"
          RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["RESPONSE"])
          task = data.get("task", {})
          print("=== Sonar CE task ===")
          for key in ("id", "type", "componentKey", "componentName", "status", "submittedAt", "startedAt", "executedAt", "executionTimeMs", "analysisId", "errorMessage"):
              value = task.get(key)
              if value is not None:
                  print(f"{key}: {value}")
          if task.get("errorStacktrace"):
              print("errorStacktrace:")
              print(task["errorStacktrace"])
          PY

          status="$(RESPONSE="$response" python3 -c 'import json,os; print(json.loads(os.environ["RESPONSE"]).get("task", {}).get("status", ""))')"
          if [ "$status" != "SUCCESS" ]; then
            echo "::error::SonarQube Cloud analysis processing failed: scan outcome=${SCAN_OUTCOME}, CE status=${status}."
            exit 1
          fi
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::warning::SonarQube Cloud analysis processed successfully, but scanner outcome=${SCAN_OUTCOME}. This usually means the quality gate failed; see the SonarCloud dashboard."
          fi

  local-smoke-analysis:
    name: Local SonarQube smoke analysis
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'local-smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for local SonarQube
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            status="$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            if [ "$status" = "UP" ]; then
              echo "SonarQube is UP"
              exit 0
            fi
            echo "Waiting for SonarQube (${attempt}/120): ${status:-not-ready}"
            sleep 5
          done
          docker logs "${{ job.services.sonarqube.id }}" || true
          exit 1

      - name: Create local SonarQube analysis token
        id: local-token
        run: |
          set -euo pipefail
          token="$(
            curl -fsS -u admin:admin -X POST \
              --data-urlencode "name=github-actions-smoke-${GITHUB_RUN_ID}" \
              http://localhost:9000/api/user_tokens/generate \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: SonarQube smoke scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ steps.local-token.outputs.token }}
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: >
            -Dsonar.projectKey=stonks-radar-local-smoke
            -Dsonar.qualitygate.wait=false
