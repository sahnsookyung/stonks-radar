name: sonarqube

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Analysis target"
        required: true
        default: configured
        type: choice
        options:
          - local-smoke
          - configured
      organization:
        description: "Optional SonarQube Cloud organization override"
        required: false
        default: ""
      project_key:
        description: "Optional SonarQube project key override"
        required: false
        default: ""
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-analysis:
    name: Configured SonarQube analysis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'configured' }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ github.event.inputs.organization || vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_PROJECT_KEY: ${{ github.event.inputs.project_key || vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check SonarQube configuration
        id: sonar-config
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "target=none" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not configured; skipping external SonarQube analysis."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "${SONAR_HOST_URL:-}" ]; then
            echo "target=server" >> "$GITHUB_OUTPUT"
            echo "Using configured SonarQube Server at ${SONAR_HOST_URL}"
          else
            echo "target=cloud" >> "$GITHUB_OUTPUT"
            echo "Using SonarQube Cloud organization ${SONAR_ORGANIZATION}"
          fi

      - name: SonarQube Server scan
        if: ${{ steps.sonar-config.outputs.target == 'server' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'true' }}

      - name: SonarQube Cloud scan
        if: ${{ steps.sonar-config.outputs.target == 'cloud' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'true' }}

  local-smoke-analysis:
    name: Local SonarQube smoke analysis
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'local-smoke' }}
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for local SonarQube
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            status="$(curl -fsS http://localhost:9000/api/system/status 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            if [ "$status" = "UP" ]; then
              echo "SonarQube is UP"
              exit 0
            fi
            echo "Waiting for SonarQube (${attempt}/120): ${status:-not-ready}"
            sleep 5
          done
          docker logs "${{ job.services.sonarqube.id }}" || true
          exit 1

      - name: Create local SonarQube analysis token
        id: local-token
        run: |
          set -euo pipefail
          token="$(
            curl -fsS -u admin:admin -X POST \
              --data-urlencode "name=github-actions-smoke-${GITHUB_RUN_ID}" \
              http://localhost:9000/api/user_tokens/generate \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: SonarQube smoke scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ steps.local-token.outputs.token }}
          SONAR_HOST_URL: http://localhost:9000
        with:
          args: >
            -Dsonar.projectKey=stonks-radar-local-smoke
            -Dsonar.qualitygate.wait=false
