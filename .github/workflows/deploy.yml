name: deploy

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Execution path"
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

concurrency:
  group: stonks-radar-production
  cancel-in-progress: false

jobs:
  deploy-self-hosted:
    if: ${{ inputs.runner != 'github-hosted' }}
    runs-on: [self-hosted, linux, stonks-radar-deploy]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run web:test && npm run backend:check

      - name: Build web assets
        run: npm run build:map-assets && npm run web:build

      - name: Prepare production env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Deploy local OCI compose stack
        env:
          STONKS_DEPLOY_DIR: /opt/stonks-radar
        run: scripts/deploy_self_hosted_runner.sh /tmp/stonks-production.env

  deploy-github-hosted:
    if: ${{ inputs.runner == 'github-hosted' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run web:test && npm run backend:check

      - name: Build web assets
        run: npm run build:map-assets && npm run web:build

      - name: Prepare production env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Prepare SSH
        env:
          STONKS_DEPLOY_KEY: ${{ secrets.STONKS_DEPLOY_KEY }}
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STONKS_DEPLOY_KEY" > ~/.ssh/stonks_deploy_key
          chmod 600 ~/.ssh/stonks_deploy_key
          ssh-keyscan -H "$STONKS_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to OCI
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" '
            set -euo pipefail
            rm -rf \
              /tmp/stonks-radar-old-assets \
              /opt/stonks-radar/.deploy-old-assets \
              /opt/stonks-radar/node_modules \
              /opt/stonks-radar/apps/web/node_modules \
              /opt/stonks-radar/apps/web/dist \
              /opt/stonks-radar/apps/web/.generated-public \
              /opt/stonks-radar/apps/backend_elixir/deps \
              /opt/stonks-radar/apps/backend_elixir/_build \
              /opt/stonks-radar/apps/backend_elixir/.elixir_ls \
              /opt/stonks-radar/.pytest_cache
            docker container prune -f || true
            docker builder prune -af || true
            docker image prune -af || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-size=100M || true
            sudo find /var/log -type f \( -name "*.gz" -o -name "*.1" -o -name "*.old" \) -delete || true
            sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
            for volume in stonks-radar_snapshot-artifacts stonks-radar_published-snapshots; do
              mountpoint=$(docker volume inspect "$volume" --format "{{ .Mountpoint }}" 2>/dev/null || true)
              if [ -n "$mountpoint" ] && [ -d "$mountpoint" ]; then
                sudo find "$mountpoint" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
            done
            df -h / /opt /tmp || true
          '
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.gitnexus' \
            --exclude '.deploy-old-assets' \
            --exclude '.secrets' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'apps/backend_elixir/deps' \
            --exclude 'apps/backend_elixir/_build' \
            --exclude 'apps/backend_elixir/.elixir_ls' \
            --exclude 'artifacts' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            -e "ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key" \
            ./ "$STONKS_USER@$STONKS_HOST:/opt/stonks-radar/"

      - name: Write production env
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          scp $SSH_OPTS -i ~/.ssh/stonks_deploy_key /tmp/stonks-production.env "$STONKS_USER@$STONKS_HOST:/tmp/stonks-production.env"
          ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'sudo install -m 600 -o ubuntu -g ubuntu /tmp/stonks-production.env /opt/stonks-radar/.env && rm /tmp/stonks-production.env'

      - name: Deploy compose stack
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'set -euo pipefail
             cd /opt/stonks-radar
             docker compose -f compose.yaml -f infra/docker-compose.prod.yml down --remove-orphans || true
             for volume in stonks-radar_snapshot-artifacts stonks-radar_published-snapshots; do
               mountpoint=$(docker volume inspect "$volume" --format "{{ .Mountpoint }}" 2>/dev/null || true)
               if [ -n "$mountpoint" ] && [ -d "$mountpoint" ]; then
                 sudo find "$mountpoint" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
               fi
             done
             docker image rm -f stonks-radar-api stonks-radar-api-elixir stonks-radar-fetch-sandbox || true
             docker container prune -f || true
             docker builder prune -af || true
             docker image prune -af || true
             sudo apt-get clean || true
             sudo journalctl --vacuum-size=100M || true
             sudo find /var/log -type f \( -name "*.gz" -o -name "*.1" -o -name "*.old" \) -delete || true
             sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
             df -h / /opt /tmp || true
             COMPOSE_PARALLEL_LIMIT=1 DOCKER_BUILDKIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml build api-elixir
             docker builder prune -af || true
             COMPOSE_PARALLEL_LIMIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d postgres valkey
             docker compose -f compose.yaml -f infra/docker-compose.prod.yml run --rm --no-deps api-elixir /app/bin/stonks_backend eval "StonksBackend.Release.migrate()"
             COMPOSE_PARALLEL_LIMIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d api-elixir caddy
             docker image prune -f || true
             df -h / /opt /tmp || true'

      - name: Refresh published snapshots
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'docker run --rm -v stonks-radar_published-snapshots:/dest -v /opt/stonks-radar/apps/web/public/public:/src:ro alpine:3.24 sh -lc '\''set -e; rm -rf /dest/* /dest/.[!.]* /dest/..?* 2>/dev/null || true; cp -a /src/. /dest/; test -s /dest/latest/manifest.json'\'''

      - name: Verify origin health
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          ssh $SSH_OPTS -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && PUBLIC_HOSTNAME=$(awk -F= '\''$1=="PUBLIC_HOSTNAME"{print $2}'\'' .env) && test -n "$PUBLIC_HOSTNAME" && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/health" >/dev/null && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/public/latest/manifest.json" | tee /tmp/stonks-manifest.json >/dev/null && grep -q "\"current_version\"" /tmp/stonks-manifest.json && grep -q "\"objects\"" /tmp/stonks-manifest.json'
