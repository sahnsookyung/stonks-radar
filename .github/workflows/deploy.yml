name: deploy

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Execution path"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      mode:
        description: "Deployment mode"
        required: true
        default: fast
        type: choice
        options:
          - fast
          - clean
      verify:
        description: "Run full in-deploy verification even in fast mode"
        required: true
        default: false
        type: boolean
      api_image_ref:
        description: "API image tag to deploy in fast mode; defaults to current SHA"
        required: false
        default: ""
        type: string
      web_artifact_run_id:
        description: "CI run id containing web-deploy-<sha>; builds locally when blank"
        required: false
        default: ""
        type: string
      diagnose_scheduler_only:
        description: "Inspect production scheduler and Oban state without changing services"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: stonks-radar-production
  cancel-in-progress: false

jobs:
  diagnose-scheduler:
    if: ${{ inputs.diagnose_scheduler_only }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Prepare SSH
        env:
          STONKS_DEPLOY_KEY: ${{ secrets.STONKS_DEPLOY_KEY }}
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STONKS_DEPLOY_KEY" > ~/.ssh/stonks_deploy_key
          chmod 600 ~/.ssh/stonks_deploy_key
          ssh-keyscan -H "$STONKS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect scheduler without mutation
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          scheduler_report="$(
            ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/stonks-radar
          printf 'scheduler_flags='
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml exec -T api-elixir sh -lc \
            'printf "%s %s %s\n" "$START_SCHEDULER" "$WORKER_SCHEDULER_ENABLED" "$OBAN_QUEUES_ENABLED"' \
            </dev/null
          printf 'scheduler_logs\n'
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml logs --since 30m --no-color api-elixir 2>&1 \
            | grep -E 'elixir_recurring_scheduler_(scheduled|failed)' \
            | tail -20 || true
          printf 'snapshot_refresh_jobs\n'
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml exec -T postgres sh -lc '
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "
              select id::text, state, queue, attempt::text, max_attempts::text,
                     inserted_at::text, coalesce(scheduled_at::text, \$\$-\$\$),
                     coalesce(attempted_at::text, \$\$-\$\$), coalesce(completed_at::text, \$\$-\$\$),
                     replace(left(coalesce(errors[array_upper(errors, 1)] ->> \$\$error\$\$, \$\$\$\$), 500), chr(10), \$\$ \$\$)
              from oban_jobs
              where args ->> \$\$job_type\$\$ = \$\$snapshot_refresh\$\$
              order by id desc
              limit 10
            "
          ' </dev/null
          REMOTE
          )"
          printf '%s\n' "$scheduler_report"

  deploy-self-hosted:
    if: ${{ !inputs.diagnose_scheduler_only && inputs.runner != 'github-hosted' }}
    runs-on: [self-hosted, linux, stonks-radar-deploy]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require green CI and SonarQube for fast deploy
        if: ${{ inputs.mode == 'fast' && !inputs.verify }}
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              { workflow_id: "ci.yml", label: "ci" },
              { workflow_id: "sonarqube.yml", label: "sonarqube" },
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head_sha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const pending = [];

              for (const check of required) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: check.workflow_id,
                  head_sha,
                  per_page: 10,
                });

                const latest = data.workflow_runs.find((run) => run.head_sha === head_sha);
                if (!latest) {
                  pending.push(check.label);
                  continue;
                }

                if (latest.status === "completed" && latest.conclusion !== "success") {
                  core.setFailed(`${check.label} completed with ${latest.conclusion}: ${latest.html_url}`);
                  return;
                }

                if (latest.status !== "completed") {
                  pending.push(check.label);
                }
              }

              if (pending.length === 0) {
                core.info(`CI and SonarQube are green for ${head_sha}.`);
                return;
              }

              core.info(`Waiting for ${pending.join(", ")} on ${head_sha} (attempt ${attempt}/60).`);
              await sleep(20_000);
            }

            core.setFailed(`Timed out waiting for CI and SonarQube to pass for ${head_sha}.`);

      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        with:
          node-version: 22
          cache: npm

      - uses: erlef/setup-beam@v1
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install dependencies
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        run: npm install

      - name: Download web deploy artifact
        if: ${{ inputs.mode == 'fast' && !inputs.verify && inputs.web_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: web-deploy-${{ github.sha }}
          path: web-deploy-artifact
          run-id: ${{ inputs.web_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Materialize downloaded web artifact
        if: ${{ inputs.mode == 'fast' && !inputs.verify && inputs.web_artifact_run_id != '' }}
        run: |
          set -euo pipefail
          artifact_root=""
          for candidate in web-deploy-artifact web-deploy-artifact/web-deploy web-deploy-artifact/artifacts/web-deploy; do
            if [ -s "$candidate/apps/web/dist/index.html" ]; then
              artifact_root="$candidate"
              break
            fi
          done
          if [ -z "$artifact_root" ]; then
            find web-deploy-artifact -maxdepth 6 -type f | sort
            echo "Downloaded web artifact did not contain apps/web/dist/index.html" >&2
            exit 1
          fi
          rm -rf apps/web/dist apps/web/public/public
          mkdir -p apps/web/public
          cp -a "$artifact_root/apps/web/dist" apps/web/dist
          cp -a "$artifact_root/apps/web/public/public" apps/web/public/public
          test -s apps/web/dist/index.html
          test -s apps/web/public/public/latest/manifest.json

      - name: Install Playwright browser
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        run: npx playwright install --with-deps chromium

      - name: Verify
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        run: npm run web:test && npm run backend:check

      - name: Build web assets
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        run: npm run build:map-assets && npm run web:build
        env:
          VITE_WEB_ARTIFACT_VERSION: ${{ github.sha }}

      - name: Prepare production env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Deploy local OCI compose stack
        env:
          STONKS_DEPLOY_DIR: /opt/stonks-radar
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
          STONKS_GHCR_ACTOR: ${{ github.actor }}
          STONKS_GHCR_TOKEN: ${{ github.token }}
        run: scripts/deploy_self_hosted_runner.sh /tmp/stonks-production.env

  deploy-github-hosted:
    if: ${{ !inputs.diagnose_scheduler_only && inputs.runner == 'github-hosted' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize deploy timing summary
        env:
          API_IMAGE_REF: ${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
          WEB_ARTIFACT_RUN_ID: ${{ inputs.web_artifact_run_id }}
        run: |
          {
            echo "- API image ref: \`$API_IMAGE_REF\`"
            echo "- Web artifact run id: \`${WEB_ARTIFACT_RUN_ID:-local-build}\`"
            echo
            echo "### Deploy phase timings"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require green CI and SonarQube for fast deploy
        if: ${{ inputs.mode == 'fast' && !inputs.verify }}
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              { workflow_id: "ci.yml", label: "ci" },
              { workflow_id: "sonarqube.yml", label: "sonarqube" },
            ];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head_sha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const pending = [];

              for (const check of required) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: check.workflow_id,
                  head_sha,
                  per_page: 10,
                });

                const latest = data.workflow_runs.find((run) => run.head_sha === head_sha);
                if (!latest) {
                  pending.push(check.label);
                  continue;
                }

                if (latest.status === "completed" && latest.conclusion !== "success") {
                  core.setFailed(`${check.label} completed with ${latest.conclusion}: ${latest.html_url}`);
                  return;
                }

                if (latest.status !== "completed") {
                  pending.push(check.label);
                }
              }

              if (pending.length === 0) {
                core.info(`CI and SonarQube are green for ${head_sha}.`);
                return;
              }

              core.info(`Waiting for ${pending.join(", ")} on ${head_sha} (attempt ${attempt}/60).`);
              await sleep(20_000);
            }

            core.setFailed(`Timed out waiting for CI and SonarQube to pass for ${head_sha}.`);

      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        with:
          node-version: 22
          cache: npm

      - uses: erlef/setup-beam@v1
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - name: Install dependencies
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        run: npm install

      - name: Download web deploy artifact
        if: ${{ inputs.mode == 'fast' && !inputs.verify && inputs.web_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: web-deploy-${{ github.sha }}
          path: web-deploy-artifact
          run-id: ${{ inputs.web_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Materialize downloaded web artifact
        if: ${{ inputs.mode == 'fast' && !inputs.verify && inputs.web_artifact_run_id != '' }}
        run: |
          set -euo pipefail
          artifact_root=""
          for candidate in web-deploy-artifact web-deploy-artifact/web-deploy web-deploy-artifact/artifacts/web-deploy; do
            if [ -s "$candidate/apps/web/dist/index.html" ]; then
              artifact_root="$candidate"
              break
            fi
          done
          if [ -z "$artifact_root" ]; then
            find web-deploy-artifact -maxdepth 6 -type f | sort
            echo "Downloaded web artifact did not contain apps/web/dist/index.html" >&2
            exit 1
          fi
          rm -rf apps/web/dist apps/web/public/public
          mkdir -p apps/web/public
          cp -a "$artifact_root/apps/web/dist" apps/web/dist
          cp -a "$artifact_root/apps/web/public/public" apps/web/public/public
          test -s apps/web/dist/index.html
          test -s apps/web/public/public/latest/manifest.json

      - name: Install Playwright browser
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        run: npx playwright install --with-deps chromium

      - name: Verify
        if: ${{ inputs.mode == 'clean' || inputs.verify }}
        run: npm run web:test && npm run backend:check

      - name: Build web assets
        if: ${{ inputs.mode == 'clean' || inputs.verify || inputs.web_artifact_run_id == '' }}
        run: npm run build:map-assets && npm run web:build
        env:
          VITE_WEB_ARTIFACT_VERSION: ${{ github.sha }}

      - name: Prepare production env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Prepare SSH
        env:
          STONKS_DEPLOY_KEY: ${{ secrets.STONKS_DEPLOY_KEY }}
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STONKS_DEPLOY_KEY" > ~/.ssh/stonks_deploy_key
          chmod 600 ~/.ssh/stonks_deploy_key
          ssh-keyscan -H "$STONKS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare host
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            "STONKS_DEPLOY_MODE='$STONKS_DEPLOY_MODE' bash -s" <<'REMOTE'
          set -euo pipefail
          deploy_dir="${STONKS_DEPLOY_DIR:-/opt/stonks-radar}"
          mkdir -p "$deploy_dir"
          if [ "${STONKS_DEPLOY_MODE:-fast}" = "clean" ]; then
            if [ -f "$deploy_dir/compose.yaml" ]; then
              (cd "$deploy_dir" && docker compose -f compose.yaml -f infra/docker-compose.prod.yml down --remove-orphans || true)
            fi
            rm -rf \
              /tmp/stonks-radar-old-assets \
              "$deploy_dir/.deploy-old-assets" \
              "$deploy_dir/node_modules" \
              "$deploy_dir/apps/web/node_modules" \
              "$deploy_dir/apps/web/dist" \
              "$deploy_dir/apps/web/.generated-public" \
              "$deploy_dir/apps/backend_elixir/deps" \
              "$deploy_dir/apps/backend_elixir/_build" \
              "$deploy_dir/apps/backend_elixir/.elixir_ls"
            for volume in stonks-radar_snapshot-artifacts stonks-radar_published-snapshots; do
              mountpoint=$(docker volume inspect "$volume" --format "{{ .Mountpoint }}" 2>/dev/null || true)
              if [ -n "$mountpoint" ] && [ -d "$mountpoint" ]; then
                sudo find "$mountpoint" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              fi
            done
            docker image rm -f stonks-radar-api-elixir || true
            docker container prune -f || true
            docker builder prune -af || true
            docker image prune -af || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-size=100M || true
            sudo find /var/log -type f \( -name "*.gz" -o -name "*.1" -o -name "*.old" \) -delete || true
            sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          else
            docker container prune -f || true
          fi
          df -h / /opt /tmp || true
          REMOTE
          duration="$(( $(date +%s) - start ))"
          echo "| prepare-host | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync release to OCI
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          RSYNC_SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -i ~/.ssh/stonks_deploy_key"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.gitnexus' \
            --exclude '.deploy-old-assets' \
            --exclude '.secrets' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'apps/backend_elixir/deps' \
            --exclude 'apps/backend_elixir/_build' \
            --exclude 'apps/backend_elixir/.elixir_ls' \
            --exclude 'artifacts' \
            --exclude 'web-deploy-artifact' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            -e "$RSYNC_SSH" \
            ./ "$STONKS_USER@$STONKS_HOST:/opt/stonks-radar/"
          duration="$(( $(date +%s) - start ))"
          echo "| sync-release | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Write production env
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          scp "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key /tmp/stonks-production.env "$STONKS_USER@$STONKS_HOST:/tmp/stonks-production.env"
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'sudo install -m 600 -o ubuntu -g ubuntu /tmp/stonks-production.env /opt/stonks-radar/.env && rm /tmp/stonks-production.env'

      - name: Build or pull API image
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
          STONKS_GHCR_ACTOR: ${{ github.actor }}
          STONKS_GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          if [[ "$STONKS_DEPLOY_MODE" == "fast" ]]; then
            printf '%s\n' "$STONKS_GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
              "docker login ghcr.io -u '$STONKS_GHCR_ACTOR' --password-stdin"
            ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
              "docker pull '$STONKS_API_IMAGE'"
          else
            ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
              'cd /opt/stonks-radar && COMPOSE_PARALLEL_LIMIT=1 DOCKER_BUILDKIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml build api-elixir'
          fi
          duration="$(( $(date +%s) - start ))"
          echo "| build-or-pull-api | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run migrations
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            "STONKS_DEPLOY_MODE='$STONKS_DEPLOY_MODE' STONKS_API_IMAGE='$STONKS_API_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/stonks-radar
          if [[ "${STONKS_DEPLOY_MODE:-fast}" == "fast" ]]; then
            export API_ELIXIR_IMAGE="$STONKS_API_IMAGE"
          fi
          migration_complete=0
          restore_api_on_migration_failure() {
            if [[ "$migration_complete" != "1" ]]; then
              COMPOSE_PARALLEL_LIMIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d api-elixir caddy || true
            fi
          }
          trap restore_api_on_migration_failure EXIT
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml stop api-elixir || true
          COMPOSE_PARALLEL_LIMIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d postgres valkey
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml run --rm --no-deps api-elixir \
            /app/bin/stonks_backend eval "StonksBackend.Release.migrate()"
          migration_complete=1
          trap - EXIT
          REMOTE
          duration="$(( $(date +%s) - start ))"
          echo "| migrate | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Start services
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            "STONKS_DEPLOY_MODE='$STONKS_DEPLOY_MODE' STONKS_API_IMAGE='$STONKS_API_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/stonks-radar
          if [[ "${STONKS_DEPLOY_MODE:-fast}" == "fast" ]]; then
            export API_ELIXIR_IMAGE="$STONKS_API_IMAGE"
          fi
          COMPOSE_PARALLEL_LIMIT=1 docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d api-elixir caddy
          df -h / /opt /tmp || true
          REMOTE
          duration="$(( $(date +%s) - start ))"
          echo "| start | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify scheduler runtime
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            "STONKS_DEPLOY_MODE='$STONKS_DEPLOY_MODE' STONKS_API_IMAGE='$STONKS_API_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/stonks-radar
          if [[ "${STONKS_DEPLOY_MODE:-fast}" == "fast" ]]; then
            export API_ELIXIR_IMAGE="$STONKS_API_IMAGE"
          fi
          flags="$(
            docker compose -f compose.yaml -f infra/docker-compose.prod.yml exec -T api-elixir sh -lc \
              'printf "%s %s %s" "$START_SCHEDULER" "$WORKER_SCHEDULER_ENABLED" "$OBAN_QUEUES_ENABLED"' \
              </dev/null
          )"
          if [[ "$flags" != "true true true" ]]; then
            echo "Production scheduler flags are not enabled: $flags" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            logs="$(docker compose -f compose.yaml -f infra/docker-compose.prod.yml logs --since 5m --no-color api-elixir 2>&1 || true)"
            if grep -q "elixir_recurring_scheduler_failed" <<<"$logs"; then
              grep "elixir_recurring_scheduler_failed" <<<"$logs" >&2
              exit 1
            fi
            if grep -q "elixir_recurring_scheduler_scheduled" <<<"$logs"; then
              grep "elixir_recurring_scheduler_scheduled" <<<"$logs" | tail -1
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Production scheduler did not emit a scheduling heartbeat within 30 seconds" >&2
              exit 1
            fi
            sleep 5
          done
          snapshot_jobs="$(
            docker compose -f compose.yaml -f infra/docker-compose.prod.yml exec -T postgres sh -lc '
              psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F "|" -c "
                select id::text, state, attempt::text, max_attempts::text,
                       inserted_at::text, coalesce(attempted_at::text, \$\$-\$\$),
                       coalesce(completed_at::text, \$\$-\$\$),
                       replace(left(coalesce(errors[array_upper(errors, 1)] ->> \$\$error\$\$, \$\$\$\$), 500), chr(10), \$\$ \$\$)
                from oban_jobs
                where args ->> \$\$job_type\$\$ = \$\$snapshot_refresh\$\$
                order by id desc
                limit 5
              "
            ' </dev/null
          )"
          if [[ -z "$snapshot_jobs" ]]; then
            echo "No snapshot_refresh jobs found" >&2
            exit 1
          fi
          printf 'snapshot_refresh_jobs\n%s\n' "$snapshot_jobs"
          REMOTE
          duration="$(( $(date +%s) - start ))"
          echo "| verify-scheduler | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh published snapshots
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
          STONKS_DEPLOY_MODE: ${{ inputs.mode }}
          STONKS_API_IMAGE: ghcr.io/${{ github.repository_owner }}/stonks-radar-api-elixir:${{ inputs.api_image_ref != '' && inputs.api_image_ref || github.sha }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            "STONKS_DEPLOY_MODE='$STONKS_DEPLOY_MODE' STONKS_API_IMAGE='$STONKS_API_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/stonks-radar
          if [[ "${STONKS_DEPLOY_MODE:-fast}" == "fast" ]]; then
            export API_ELIXIR_IMAGE="$STONKS_API_IMAGE"
          fi
          if ! docker run --rm -v stonks-radar_published-snapshots:/dest:ro alpine:3.24 test -s /dest/latest/manifest.json; then
            echo "Snapshot volume is empty; seeding static public snapshots before Elixir refresh"
            docker run --rm \
              -v stonks-radar_published-snapshots:/dest \
              -v /opt/stonks-radar/apps/web/public/public:/src:ro \
              alpine:3.24 \
              sh -lc 'set -e; rm -rf /dest/* /dest/.[!.]* /dest/..?* 2>/dev/null || true; cp -a /src/. /dest/; chmod -R a+rwX /dest; test -s /dest/latest/manifest.json'
          fi
          docker run --rm -v stonks-radar_published-snapshots:/dest alpine:3.24 chmod -R a+rwX /dest
          docker compose -f compose.yaml -f infra/docker-compose.prod.yml run --rm --no-deps api-elixir \
            env START_SCHEDULER=false OBAN_QUEUES_ENABLED=false \
            /app/bin/stonks_backend eval '
              {:ok, _} = Application.ensure_all_started(:stonks_backend)
              case StonksBackend.Snapshots.refresh(%{"requested_by" => "deploy", "mode" => "db_generated_publish"}) do
                {:ok, result} -> IO.inspect(result, label: "published_snapshot")
                {:error, reason} -> raise "snapshot refresh failed: #{inspect(reason)}"
              end
            '
          REMOTE
          duration="$(( $(date +%s) - start ))"
          echo "| refresh-snapshots | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify origin health
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes)
          ssh "${SSH_OPTS[@]}" -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar
             PUBLIC_HOSTNAME=$(awk -F= '\''$1=="PUBLIC_HOSTNAME"{print $2}'\'' .env)
             test -n "$PUBLIC_HOSTNAME"
             curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/" >/dev/null
             curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/health" | grep -q "\"status\":\"ok\""
             test "$(curl -sS -o /dev/null -w "%{http_code}" --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/status")" = "404"
             test "$(curl -sS -o /dev/null -w "%{http_code}" --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/provider-status")" = "404"
             curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/public/latest/manifest.json" | tee /tmp/stonks-origin-manifest.json >/dev/null
             grep -q "\"current_version\"" /tmp/stonks-origin-manifest.json
             grep -q "\"objects\"" /tmp/stonks-origin-manifest.json
             origin_manifest_hash=$(sha256sum /tmp/stonks-origin-manifest.json | cut -d" " -f1)
             for attempt in 1 2 3 4 5; do
               curl -fsS "https://$PUBLIC_HOSTNAME/public/latest/manifest.json" | tee /tmp/stonks-public-manifest.json >/dev/null
               public_manifest_hash=$(sha256sum /tmp/stonks-public-manifest.json | cut -d" " -f1)
               if [ "$origin_manifest_hash" = "$public_manifest_hash" ]; then
                 echo "origin/public manifest hash matched: sha256:$origin_manifest_hash"
                 break
               fi
               if [ "$attempt" = "5" ]; then
                 echo "public manifest hash $public_manifest_hash did not match origin manifest hash $origin_manifest_hash" >&2
                 exit 1
               fi
               sleep 3
             done
             curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/instruments/search?q=IBM&limit=1&context=BUILDER" | grep -q "IBM"
             curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/en/curves" >/dev/null'
          duration="$(( $(date +%s) - start ))"
          echo "| smoke | ${duration}s |" >> "$GITHUB_STEP_SUMMARY"
