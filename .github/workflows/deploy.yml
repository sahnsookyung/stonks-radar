name: deploy

on:
  workflow_dispatch:

concurrency:
  group: stonks-radar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm install

      - name: Verify
        run: npm run test:all

      - name: Prepare production snapshot env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Build web assets
        run: STONKS_SNAPSHOT_ENV_FILE=/tmp/stonks-production.env npm run build

      - name: Prepare SSH
        env:
          STONKS_DEPLOY_KEY: ${{ secrets.STONKS_DEPLOY_KEY }}
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STONKS_DEPLOY_KEY" > ~/.ssh/stonks_deploy_key
          chmod 600 ~/.ssh/stonks_deploy_key
          ssh-keyscan -H "$STONKS_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to OCI
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'rm -rf /tmp/stonks-radar-old-assets && mkdir -p /tmp/stonks-radar-old-assets && if [ -d /opt/stonks-radar/apps/web/dist/assets ]; then cp -an /opt/stonks-radar/apps/web/dist/assets/. /tmp/stonks-radar-old-assets/; fi'
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.gitnexus' \
            --exclude '.secrets' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'artifacts' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            -e "ssh -i ~/.ssh/stonks_deploy_key" \
            ./ "$STONKS_USER@$STONKS_HOST:/opt/stonks-radar/"
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'mkdir -p /opt/stonks-radar/apps/web/dist/assets && cp -an /tmp/stonks-radar-old-assets/. /opt/stonks-radar/apps/web/dist/assets/ || true && rm -rf /tmp/stonks-radar-old-assets'

      - name: Write production env
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/stonks_deploy_key /tmp/stonks-production.env "$STONKS_USER@$STONKS_HOST:/tmp/stonks-production.env"
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'sudo install -m 600 -o ubuntu -g ubuntu /tmp/stonks-production.env /opt/stonks-radar/.env && rm /tmp/stonks-production.env'

      - name: Deploy compose stack
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && docker compose -f compose.yaml -f infra/docker-compose.prod.yml build --pull && docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d && docker builder prune -af'

      - name: Refresh published snapshots
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'docker run --rm -v stonks-radar_published-snapshots:/dest -v /opt/stonks-radar/apps/web/dist/public:/src:ro alpine:3.22 sh -c "rm -rf /dest/* && cp -a /src/. /dest/"'

      - name: Verify origin health
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && PUBLIC_HOSTNAME=$(awk -F= '\''$1=="PUBLIC_HOSTNAME"{print $2}'\'' .env) && test -n "$PUBLIC_HOSTNAME" && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/health" >/dev/null && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/public/latest/manifest.json" | python3 -c "import json, sys; data=json.load(sys.stdin); assert data.get(\"current_version\") and data.get(\"objects\")"'
