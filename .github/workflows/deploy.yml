name: deploy

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Execution path"
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - github-hosted

concurrency:
  group: stonks-radar-production
  cancel-in-progress: false

jobs:
  deploy-self-hosted:
    if: ${{ inputs.runner != 'github-hosted' }}
    runs-on: [self-hosted, linux, stonks-radar-deploy]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run seed:snapshots && npm run test:all

      - name: Prepare production snapshot env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Build web assets
        run: STONKS_SNAPSHOT_ENV_FILE=/tmp/stonks-production.env npm run build

      - name: Promote generated snapshots for runtime seed
        run: |
          set -euo pipefail
          test -f apps/web/.generated-public/public/latest/manifest.json
          rm -rf apps/web/public/public
          mkdir -p apps/web/public
          cp -a apps/web/.generated-public/public apps/web/public/public

      - name: Deploy local OCI compose stack
        env:
          STONKS_DEPLOY_DIR: /opt/stonks-radar
        run: scripts/deploy_self_hosted_runner.sh /tmp/stonks-production.env

  deploy-github-hosted:
    if: ${{ inputs.runner == 'github-hosted' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20.2"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run seed:snapshots && npm run test:all

      - name: Prepare production snapshot env
        env:
          STONKS_PRODUCTION_ENV_B64: ${{ secrets.STONKS_PRODUCTION_ENV_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$STONKS_PRODUCTION_ENV_B64" | base64 -d > /tmp/stonks-production.env
          chmod 600 /tmp/stonks-production.env

      - name: Build web assets
        run: STONKS_SNAPSHOT_ENV_FILE=/tmp/stonks-production.env npm run build

      - name: Promote generated snapshots for runtime seed
        run: |
          set -euo pipefail
          test -f apps/web/.generated-public/public/latest/manifest.json
          rm -rf apps/web/public/public
          mkdir -p apps/web/public
          cp -a apps/web/.generated-public/public apps/web/public/public

      - name: Prepare SSH
        env:
          STONKS_DEPLOY_KEY: ${{ secrets.STONKS_DEPLOY_KEY }}
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STONKS_DEPLOY_KEY" > ~/.ssh/stonks_deploy_key
          chmod 600 ~/.ssh/stonks_deploy_key
          ssh-keyscan -H "$STONKS_HOST" >> ~/.ssh/known_hosts

      - name: Sync release to OCI
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" '
            set -euo pipefail
            rm -rf \
              /tmp/stonks-radar-old-assets \
              /opt/stonks-radar/.deploy-old-assets \
              /opt/stonks-radar/node_modules \
              /opt/stonks-radar/apps/web/node_modules \
              /opt/stonks-radar/apps/web/.generated-public \
              /opt/stonks-radar/apps/backend_elixir/deps \
              /opt/stonks-radar/apps/backend_elixir/_build \
              /opt/stonks-radar/apps/backend_elixir/.elixir_ls \
              /opt/stonks-radar/.pytest_cache
            docker container prune -f || true
            docker builder prune -af || true
            docker image prune -af || true
            df -h / /opt /tmp || true
          '
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'rm -rf /opt/stonks-radar/.deploy-old-assets && mkdir -p /opt/stonks-radar/.deploy-old-assets && if [ -d /opt/stonks-radar/apps/web/dist/assets ]; then cp -an /opt/stonks-radar/apps/web/dist/assets/. /opt/stonks-radar/.deploy-old-assets/; fi'
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.gitnexus' \
            --exclude '.deploy-old-assets' \
            --exclude '.secrets' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'apps/backend_elixir/deps' \
            --exclude 'apps/backend_elixir/_build' \
            --exclude 'apps/backend_elixir/.elixir_ls' \
            --exclude 'artifacts' \
            --exclude 'playwright-report' \
            --exclude 'test-results' \
            -e "ssh -i ~/.ssh/stonks_deploy_key" \
            ./ "$STONKS_USER@$STONKS_HOST:/opt/stonks-radar/"
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'mkdir -p /opt/stonks-radar/apps/web/dist/assets && cp -an /opt/stonks-radar/.deploy-old-assets/. /opt/stonks-radar/apps/web/dist/assets/ || true && rm -rf /opt/stonks-radar/.deploy-old-assets'

      - name: Write production env
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/stonks_deploy_key /tmp/stonks-production.env "$STONKS_USER@$STONKS_HOST:/tmp/stonks-production.env"
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'sudo install -m 600 -o ubuntu -g ubuntu /tmp/stonks-production.env /opt/stonks-radar/.env && rm /tmp/stonks-production.env'

      - name: Deploy compose stack
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && docker compose -f compose.yaml -f infra/docker-compose.prod.yml build --pull && docker compose -f compose.yaml -f infra/docker-compose.prod.yml up -d && docker builder prune -af'

      - name: Refresh published snapshots
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && docker compose -f compose.yaml -f infra/docker-compose.prod.yml run --rm -e PYTHONPATH=/app worker python scripts/publish_runtime_snapshots.py --generated-by github-actions-deploy'

      - name: Verify origin health
        env:
          STONKS_HOST: ${{ secrets.STONKS_HOST }}
          STONKS_USER: ${{ secrets.STONKS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stonks_deploy_key "$STONKS_USER@$STONKS_HOST" \
            'cd /opt/stonks-radar && PUBLIC_HOSTNAME=$(awk -F= '\''$1=="PUBLIC_HOSTNAME"{print $2}'\'' .env) && test -n "$PUBLIC_HOSTNAME" && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/api/public/health" >/dev/null && curl -fsS --resolve "$PUBLIC_HOSTNAME:443:127.0.0.1" "https://$PUBLIC_HOSTNAME/public/latest/manifest.json" | python3 -c "import json, sys; data=json.load(sys.stdin); assert data.get(\"current_version\") and data.get(\"objects\")"'
